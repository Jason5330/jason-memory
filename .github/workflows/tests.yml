name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]  # ubuntu-latest (26.04) has no Python 3.9
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Build release ZIP and run its packaged tests
        shell: bash
        run: |
          python tools/build_download.py --output "$RUNNER_TEMP/pkg/jason-memory.zip"
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/pkg/jason-memory.zip" "$RUNNER_TEMP/pkg/unpacked"
          cd "$RUNNER_TEMP/pkg/unpacked/jason-memory"
          python -m unittest discover -s tests -v
