name: Release
on:
  push:
    tags: ['*-20*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test source
        run: python -m unittest discover -s tests
      - name: Build both ZIPs and checksums
        run: |
          python tools/build_download.py --output dist/jason-memory.zip
          python tools/build_global_download.py --output dist/jason-memory-global.zip
          cd dist && sha256sum jason-memory.zip jason-memory-global.zip > SHA256SUMS.txt
      - name: Test the packaged project ZIP
        run: |
          python -c "import zipfile; zipfile.ZipFile('dist/jason-memory.zip').extractall('unpacked')"
          cd unpacked/jason-memory && python -m unittest discover -s tests
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          title=$(head -n 1 "$notes" | sed 's/^# //')
          tail -n +3 "$notes" > body.md
          gh release create "$TAG" dist/jason-memory.zip dist/jason-memory-global.zip dist/SHA256SUMS.txt \
            --title "$title" --notes-file body.md --latest
